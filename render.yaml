  # ─── API Gateway (entry point for frontend) ───────────────────────────────
  - type: web
    name: chainstrike-gateway
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm ci && npx turbo run build --filter=@chainstrike/api-gateway...
    startCommand: node apps/api-gateway/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GATEWAY_PORT
        value: 10000
      - key: JWT_SECRET
        fromService:
          name: chainstrike-identity
          type: web
          envVarKey: JWT_SECRET
      - key: INTERNAL_SECRET
        fromService:
          name: chainstrike-identity
          type: web
          envVarKey: INTERNAL_SECRET
      - key: IDENTITY_SERVICE_URL
        value: https://chainstrike-identity.onrender.com
      - key: ASSET_SERVICE_URL
        value: https://chainstrike-asset.onrender.com
      - key: COMPLIANCE_SERVICE_URL
        value: https://chainstrike-compliance.onrender.com
      - key: SETTLEMENT_SERVICE_URL
        value: https://chainstrike-settlement.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://chainstrike.vercel.app,http://localhost:3000
