services:
  # ─── Identity Service ─────────────────────────────────────────────────────
  - type: web
    name: chainstrike-identity
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: >-
      npm ci &&
      npx turbo run build --filter=@chainstrike/identity-service... &&
      cd services/identity &&
      DATABASE_URL="${IDENTITY_DATABASE_URL}" npx prisma migrate deploy --schema=prisma/schema.prisma
    startCommand: node services/identity/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: IDENTITY_SERVICE_PORT
        value: 10000
      - key: IDENTITY_DATABASE_URL
        value: postgresql://chainstrike_user:YGekQ8oluuRVGNZCJL62J0EX4Le3DlOW@dpg-d86atn0jo89c738rkte0-a.oregon-postgres.render.com:5432/chainstrike?schema=identity
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ALGORAND_NETWORK
        value: testnet
      - key: ALGORAND_ALGOD_SERVER
        value: https://testnet-api.algonode.cloud
      - key: ALGORAND_ALGOD_PORT
        value: 443
      - key: ALGORAND_ALGOD_TOKEN
        value: ""
      - key: ALGORAND_INDEXER_SERVER
        value: https://testnet-idx.algonode.cloud
      - key: ALGORAND_INDEXER_PORT
        value: 443
      - key: ADMIN_WALLET_ADDRESS
        value: HMPG7YLTESN4FQXIGCAHQOXDEIDUIFBOINJDGQ7WUFBTYMOIKDIN6CITPM
      - key: SUMSUB_APP_TOKEN
        value: TESTNET_PLACEHOLDER
      - key: SUMSUB_SECRET_KEY
        value: TESTNET_PLACEHOLDER
      - key: SUMSUB_BASE_URL
        value: https://api.sumsub.com
      - key: KAFKA_ENABLED
        value: false

  # ─── Asset Service ────────────────────────────────────────────────────────
  - type: web
    name: chainstrike-asset
    env: node
    region: oregon
    plan: free
    branch: main
