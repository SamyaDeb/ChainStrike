      npx turbo run build --filter=@chainstrike/asset-service... &&
      cd services/asset &&
      DATABASE_URL="${ASSET_DATABASE_URL}" npx prisma migrate deploy --schema=prisma/schema.prisma
    startCommand: node services/asset/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ASSET_SERVICE_PORT
        value: 10000
      - key: ASSET_DATABASE_URL
        value: postgresql://chainstrike_user:YGekQ8oluuRVGNZCJL62J0EX4Le3DlOW@dpg-d86atn0jo89c738rkte0-a.oregon-postgres.render.com:5432/chainstrike?schema=asset
      - key: JWT_SECRET
        fromService:
          name: chainstrike-identity
          type: web
          envVarKey: JWT_SECRET
      - key: INTERNAL_SECRET
        fromService:
          name: chainstrike-identity
          type: web
          envVarKey: INTERNAL_SECRET
      - key: IDENTITY_SERVICE_URL
        value: https://chainstrike-identity.onrender.com
      - key: USDC_ASSET_ID
        value: 10458941
      - key: ALGORAND_NETWORK
        value: testnet
      - key: ALGORAND_ALGOD_SERVER
        value: https://testnet-api.algonode.cloud
      - key: ALGORAND_ALGOD_PORT
        value: 443
      - key: ALGORAND_ALGOD_TOKEN
        value: ""
      - key: ALGORAND_INDEXER_SERVER
        value: https://testnet-idx.algonode.cloud
      - key: ALGORAND_INDEXER_PORT
        value: 443
      - key: ALGORAND_ADMIN_MNEMONIC
        value: crack scout prefer purchase seat fever tilt tornado knee ridge twice pulp man card stereo worry come disease thunder crash liberty toss leader abstract toss
      - key: WHITELIST_REGISTRY_APP_ID
        value: 762550520
      - key: ESCROW_CONTRACT_APP_ID
        value: 762585096
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        value: TESTNET_PLACEHOLDER
      - key: AWS_SECRET_ACCESS_KEY
        value: TESTNET_PLACEHOLDER
      - key: AWS_S3_BUCKET_DOCUMENTS
        value: chainstrike-documents-testnet
      - key: AWS_S3_SKIP_UPLOAD
        value: true
      - key: KAFKA_ENABLED
        value: false

